name: ML Smoke Test

on:
  push:
    paths:
      - 'Projects/ML/**'
      - '.github/workflows/python-ml.yml'
  pull_request:
    paths:
      - 'Projects/ML/**'

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Projects/ML/requirements.txt
      - run: pip install -r Projects/ML/requirements.txt
      - name: Run reduced regression pipeline
        working-directory: Projects/ML
        run: python power_plant_regression.py --folds 2 --search-iterations 1 --jobs 1 --output /tmp/grendel-ml-output
